services:
  # Full-Stack Web Service (Node.js/Express + React Vite Frontend)
  - type: web
    name: cinema-booking-system
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cinema-booking-db
          property: connectionString

databases:
  # Managed PostgreSQL Database with Row-Level Locking Support
  - name: cinema-booking-db
    databaseName: cinema_booking
    user: postgres
    plan: free
    region: oregon
